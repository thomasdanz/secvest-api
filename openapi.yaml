openapi: 3.1.0
info:
  title: ABUS Secvest Touch REST API (unofficial)
  version: 0.2.0
  description: >
    Reverse-engineered REST API of the ABUS Secvest Touch (FUAA50500) as used
    by the official app. Every operation carries `x-evidence`
    (verified | source | assumption) and, where something is still unknown,
    `x-open-questions`. Examples point to the redacted responses in
    `fixtures/`. See the README.


    Observations that apply to all endpoints:

    - Responses are `application/json`. Strings are German UI texts as shown
      on the panel.

    - Ids are strings, even where they look numeric.

    - The panel may put raw control characters into JSON strings (seen in a
      log user name), so clients have to parse leniently.

    - The iOS app identifies itself as
      `Secvest/<yyyymmdd> CFNetwork/<version> Darwin/<version>` and sends
      `Accept: application/json`, `Content-Type: application/json` (also on
      GET) and a `device` header with 64 hex characters (all `f` on the test
      device).

    - Responses are pretty-printed with CRLF line endings and sent chunked,
      with `Cache-Control: no-cache, no-store, max-age=0` and
      `Access-Control-Allow-Origin: *`.

    - While the installer ("Errichter") is logged in at the panel itself, the
      API refuses every request, reading and writing, with
      `403 {"state":"installer"}`. The app then shows "Verbindung
      unterbrochen, da 'Errichter' angemeldet ist.". After the installer logs
      out, requests succeed again.

    - Wrong credentials get `401` with a small HTML body, no `Content-Type`
      and no `WWW-Authenticate` header, so clients have to send Basic Auth
      preemptively instead of waiting for a challenge.

    - An unknown path gets `404` in the same style: small HTML body, no
      `Content-Type` (see the NotFound response).

    - The panel's TLS handshake is very slow (several seconds); keep one
      connection alive and reuse TLS sessions. How the app uses the API is
      described in docs/app-behavior.md.

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: secvest.local
      port:
        default: "4433"

security:
  - basicAuth: []

x-open-questions:
  - What is the `device` header for? 64 hex characters are exactly the size of
    an APNs device token (32 bytes), and the app does receive push
    notifications, so the panel may learn the token from this header. The
    test device sends all `f`, though — a placeholder, or is the token
    registered some other way (e.g. once when the system is added in the
    app)?
  - Which methods besides the known ones does each resource accept? Is there
    a GET on a single zone (/system/partitions-{n}/zones-{zone}/)?
  - Responses for unknown ids (e.g. partitions-9, zones-999) and for
    unsupported methods. An unknown path gives the NotFound response.

paths:
  /system/:
    get:
      summary: System name and partition ids
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
              examples:
                default:
                  externalValue: fixtures/GET_system.json
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/partitions/:
    get:
      summary: All partitions with state and zone ids
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partition"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /system/partitions-{partition}/:
    parameters:
      - $ref: "#/components/parameters/partition"
    get:
      summary: One partition
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partition"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions-1.json
                armedInternally:
                  externalValue: fixtures/GET_system_partitions-1.example2.json
                armed:
                  externalValue: fixtures/GET_system_partitions-1.example3.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
    put:
      summary: Arm, arm internally or disarm a partition
      description: >
        Returns the partition with its new state. The change took effect
        immediately (0.1–0.3 s through the proxy), and the next GET already
        showed the new state; no transitional state such as an exit delay was
        visible. A pending battery fault (prevents-set false) did not block
        arming.


        Switching directly between partset and set is not possible: the panel
        answers `200` but ignores the request and returns the unchanged state
        (e.g. `set` for a request to `partset`). A client therefore has to
        compare the returned state with the requested one, and disarm first to
        switch between the two armed states. The app doesn't even try — it
        shows "Abfrage des Zustandes des Teilbereichs nicht erlaubt." without
        sending a request.
      x-evidence: verified
      x-sources: [node-red-contrib-secvest, homebridge-secvest]
      x-open-questions:
        - Response when arming is blocked by a fault with prevents-set —
          presumably also 200 with the unchanged state.
        - Does arming succeed while a non-omittable entry door is open, and
          is an exit delay visible anywhere in the API?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  $ref: "#/components/schemas/PartitionState"
            examples:
              armInternally:
                externalValue: fixtures/PUT_system_partitions-1.request.json
              disarm:
                externalValue: fixtures/PUT_system_partitions-1.example2.request.json
              arm:
                externalValue: fixtures/PUT_system_partitions-1.example3.request.json
              armInternallyWhileArmed:
                externalValue: fixtures/PUT_system_partitions-1.example4.request.json
              armWhileArmedInternally:
                externalValue: fixtures/PUT_system_partitions-1.example5.request.json
      responses:
        "200":
          description: The partition with its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partition"
              examples:
                armedInternally:
                  externalValue: fixtures/PUT_system_partitions-1.json
                disarmed:
                  externalValue: fixtures/PUT_system_partitions-1.example2.json
                armed:
                  externalValue: fixtures/PUT_system_partitions-1.example3.json
                ignoredSetToPartset:
                  summary: partset requested while set — ignored, still set
                  externalValue: fixtures/PUT_system_partitions-1.example4.json
                ignoredPartsetToSet:
                  summary: set requested while partset — ignored, still partset
                  externalValue: fixtures/PUT_system_partitions-1.example5.json
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/partitions-{partition}/zones/:
    parameters:
      - $ref: "#/components/parameters/partition"
    get:
      summary: Zones (detectors) of a partition
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions-1_zones.json
                otherStates:
                  summary: Same zones a few minutes later
                  externalValue: fixtures/GET_system_partitions-1_zones.example2.json
                doorAndWindowOpen:
                  summary: Zone 209 (omittable) and zone 219 (not omittable) open
                  externalValue: fixtures/GET_system_partitions-1_zones.example3.json
                emptyPartition:
                  summary: Partition without zones (partition 2)
                  externalValue: fixtures/GET_system_partitions-2_zones.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /system/partitions-{partition}/zones-{zone}/:
    parameters:
      - $ref: "#/components/parameters/partition"
      - name: zone
        in: path
        required: true
        description: Zone id, e.g. 209.
        schema:
          type: string
    put:
      summary: Omit (bypass) a zone or include it again
      description: >
        Used by the app's "Zone ausblenden" dialog for an open zone. Omitting
        an open zone removes its zone-open fault (prevents-set), so the
        partition can be armed. Note that `omitted` is sent as a string.
      x-evidence: verified
      x-open-questions:
        - Response for a zone with omittable=false.
        - Is the omission reset automatically on disarm, and is it logged?
          The log request right after omitting returned no new entry.
        - Does the resource accept other fields?
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [omitted]
              properties:
                omitted:
                  type: string
                  enum: ["true", "false"]
            examples:
              omit:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.request.json
              include:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.example2.request.json
      responses:
        "200":
          description: The zone after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
              examples:
                omitted:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.json
                included:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.example2.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /alarms/:
    get:
      summary: Active alarms
      x-evidence: verified
      x-open-questions:
        - Format of an entry while an alarm is active. The log knows burglary
          (with zone), zone tamper, housing/siren tamper and code tamper
          alarms, which are likely candidates.
        - Does an entry stay until the alarm is reset, and is there a way to
          reset or acknowledge it via the API?
      responses:
        "200":
          description: Empty array when no alarm is active
          content:
            application/json:
              schema:
                type: array
                items: {}
              examples:
                idle:
                  externalValue: fixtures/GET_alarms.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /faults/:
    get:
      summary: Current faults (troubles)
      description: >
        An open zone only shows up here if it is omittable. Open zones with
        `omittable: false` (the entry doors on the test panel) produce no
        fault, so they don't block arming via prevents-set. Whether a door is
        open therefore has to be read from the zones, whether arming is
        blocked from the faults.
      x-evidence: verified
      x-open-questions:
        - Why do non-omittable open zones produce no fault? Presumably they are
          entry/exit route zones with a delay, which may be open while arming.
          Does arming actually succeed with such a door open?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fault"
              examples:
                zoneOpenAndBattery:
                  externalValue: fixtures/GET_faults.json
                batteryOnly:
                  externalValue: fixtures/GET_faults.example2.json
                otherZoneOpen:
                  externalValue: fixtures/GET_faults.example3.json
                nonOmittableZoneOpen:
                  summary: >
                    Zones 209 (omittable) and 219 (not omittable) open at the
                    same time — only 209 is a fault, compare the zones example
                    doorAndWindowOpen
                  externalValue: fixtures/GET_faults.example4.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /logs/:
    get:
      summary: Event log
      description: >
        Without a filter the panel returned 600 entries, not strictly sorted.
        The fixture is a subset with one entry per message pattern. The app
        only ever asks for entries newer than the newest one it already has,
        using an OData-style `$filter`.
      x-evidence: verified
      x-open-questions:
        - The unfiltered response is not the whole log. The app shows entries
          that are missing from it (restore events such as "RF Jamming OK" or
          "SG Sabo ok", zone battery warnings, "TB n rückgesetzt"). How does
          the app get the full log — other filters, paging?
        - Which other `$filter` operators and fields work? Are `$top`,
          `$skip` or `$orderby` supported?
      parameters:
        - name: $filter
          in: query
          required: false
          description: >
            OData-style filter. Seen: `timestamp ge <unix seconds>` (the app
            uses the newest known timestamp + 1). Returns `[]` when nothing
            matches.
          schema:
            type: string
          examples:
            newerThan:
              value: timestamp ge 1789473729
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
              examples:
                subset:
                  externalValue: fixtures/GET_logs.json
                filteredNothingNew:
                  summary: $filter=timestamp ge <newest known + 1>
                  externalValue: fixtures/GET_logs_filter-timestamp-ge.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /outputs/:
    get:
      summary: Outputs
      description: >
        node-red-contrib-secvest requests `/output/` (singular); the app uses
        `/outputs/`. `/output/` is untested.
      x-evidence: verified
      x-open-questions:
        - Entry format (no outputs configured on the test panel).
        - How are outputs switched?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {}
              examples:
                none:
                  externalValue: fixtures/GET_outputs.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /cameras/:
    get:
      summary: Cameras
      x-evidence: verified
      x-open-questions:
        - Entry format (no cameras configured on the test panel).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {}
              examples:
                none:
                  externalValue: fixtures/GET_cameras.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Secvest user code as username.

  responses:
    Unauthorized:
      description: >
        Wrong credentials. Plain HTML body without a Content-Type header and
        without a WWW-Authenticate challenge. Seen on GET /system/; assumed
        for the other endpoints.
      content:
        text/html:
          schema:
            type: string
          examples:
            unauthorized:
              externalValue: fixtures/GET_system.401.html

    NotFound:
      description: >
        Unknown path (seen for GET /system404/). Plain HTML body without a
        Content-Type header, like the 401. Whether unknown ids on known
        resources answer the same way is still open.
      content:
        text/html:
          schema:
            type: string
          examples:
            notFound:
              externalValue: fixtures/GET_unknown-path.404.html

    InstallerLoggedIn:
      description: >
        The installer is logged in at the panel; the API is locked until they
        log out. Seen on every GET and on all three partition PUTs; not tested
        for the zone PUT and the zones of partitions 2-4. Unlike a 200, the
        response has no Cache-Control header.
      content:
        application/json:
          schema:
            type: object
            properties:
              state:
                type: string
                const: installer
          examples:
            installer:
              externalValue: fixtures/GET_system.403.json

  parameters:
    partition:
      name: partition
      in: path
      required: true
      description: Partition id; the panel reports partitions 1-4.
      schema:
        type: integer
        minimum: 1
        maximum: 4

  schemas:
    PartitionState:
      type: string
      enum: [unset, partset, set]
      description: >
        unset = disarmed, partset = armed internally (home), set = armed.
        There is no "alarm" state here, see /alarms/.

    System:
      type: object
      required: [name, partitions]
      properties:
        name:
          type: string
        partitions:
          type: array
          items:
            type: string

    Partition:
      type: object
      required: [id, name, state, zones]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unused partitions are named "Teilber. <n>" by default.
        state:
          $ref: "#/components/schemas/PartitionState"
        zones:
          type: array
          description: Ids of the zones assigned to the partition.
          items:
            type: string

    Zone:
      type: object
      required: [id, name, state, inner, omittable, omitted]
      properties:
        id:
          type: string
          description: Wireless zones are numbered from 201.
        name:
          type: string
        state:
          type: string
          description: Only open and closed seen so far; tamper or other values
            may exist.
          examples: [closed, open]
        inner:
          type: boolean
          description: Meaning not confirmed; true for every zone on the test
            panel.
        omittable:
          type: boolean
          description: Whether the zone may be omitted (bypassed) for arming.
            False for the entry doors on the test panel; such zones produce no
            fault in /faults/ when open.
        omitted:
          type: boolean
          description: Whether the zone is currently omitted.

    Fault:
      type: object
      required: [type, id, ui-string, affects-partition, prevents-set, prevents-reset, is-rf-warning]
      properties:
        type:
          type: string
          description: >
            Fault class. Seen: 1170 = repeater battery low, 5000 = zone open.
        id:
          type: string
          description: >
            For zone-open faults it has always been 1305 + zone id so far
            (1514 for zone 209, 1517 for zone 212) — an observation, not
            confirmed.
        ui-string:
          type: string
          description: Text as shown on the panel, e.g. "REP01 Batt schwach".
            Not stable — the same fault (same type and id) was once reported
            as "RF Repeater" in between, so don't use it as a key.
        affects-partition:
          type: array
          items:
            type: string
        affects-zone:
          type: string
          description: Only present for zone-related faults.
        prevents-set:
          type: boolean
          description: Arming is blocked while this fault is present. Omitting
            the zone removes a zone-open fault.
        prevents-reset:
          type: boolean
        is-rf-warning:
          type: boolean

    LogEntry:
      type: object
      required: [id, type, desc, events]
      properties:
        id:
          type: string
          description: >
            Appears to be (unix timestamp << 8) | sequence number within that
            second.
        type:
          type: string
          enum: [normal, alarm, trouble]
        desc:
          type: string
          description: >
            Text as shown on the panel, e.g. "Ben 001 TB 1 aktiv" (user 1 armed
            partition 1), "Einbruch Z202 Alarm", "REP01 Batt schwach".
        events:
          type: array
          description: Exactly one element in every entry seen so far.
          items:
            $ref: "#/components/schemas/LogEvent"

    LogEvent:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: string
          description: Unix time in seconds.
        partition:
          type: string
          description: '"0" in every entry seen so far.'
        user:
          type: string
          description: User slot ("0" = installer).
        username:
          type: string
        zone:
          type: string
