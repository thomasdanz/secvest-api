openapi: 3.1.0
info:
  title: ABUS Secvest Touch REST API (unofficial)
  version: 0.2.0
  description: >
    Reverse-engineered REST API of the ABUS Secvest Touch (FUAA50500) as used
    by the official app. Every operation carries `x-evidence`
    (verified | source | assumption) and, where something is still unknown,
    `x-open-questions`. Examples point to the redacted responses in
    `fixtures/`. See the README.


    Observations that apply to all endpoints:

    - Responses are `application/json`. Strings are German UI texts as shown
      on the panel.

    - Ids are strings, even where they look numeric.

    - The panel may put raw control characters into JSON strings (seen in a
      log user name), so clients have to parse leniently.

    - The iOS app identifies itself as
      `Secvest/<yyyymmdd> CFNetwork/<version> Darwin/<version>` and sends
      `Accept: application/json`, `Content-Type: application/json` (also on
      GET) and a `device` header with 64 hex characters (all `f` on the test
      device).

    - Responses are pretty-printed with CRLF line endings and sent chunked,
      with `Cache-Control: no-cache, no-store, max-age=0` and
      `Access-Control-Allow-Origin: *`.

    - While the installer ("Errichter") is logged in at the panel itself, the
      API refuses every request, reading and writing, with
      `403 {"state":"installer"}`. A normal user logged in at the keypad
      doesn't lock the API (tested; the app guide suggests otherwise). The app then shows "Verbindung
      unterbrochen, da 'Errichter' angemeldet ist.". After the installer logs
      out, requests succeed again.

    - Wrong credentials get `401` with a small HTML body, no `Content-Type`
      and no `WWW-Authenticate` header, so clients have to send Basic Auth
      preemptively instead of waiting for a challenge.

    - An unsupported method gets `403` with an empty body (seen for PUT
      /faults/ and POST /system/partitions-1/zones-209/), not 405. The same empty 403 comes for
      omitting a non-omittable zone, so an empty 403 means "action not
      allowed", unlike the installer lock's `{"state":"installer"}`.

    - Path segments are matched by prefix: any leading part of a segment's
      name works, on every level and also before the id. For example
      /system/partitions-1/z/ … /zone/ return the zone list, /system/p-1/
      partition 1, /system/partition-1/zone-209/ zone 209, /f/ the faults
      and /l/ the log. A segment that is longer than the name (zonesx,
      zoness-209) or doesn't match (x) gives 404. That is also why third-party clients
      using the singular "partition-1" and "zone" work. Using this, all
      single letters at the root were probed: apart from the known
      resources (a, c, f, l, o, r, s) every letter gives 404, so there is no
      further top-level resource — except possibly one sharing its first
      letter with a known one. The same probe under /system/ found nothing
      besides partitions, and under /system/partitions-1/ nothing besides
      zones. The paths in this
      spec are the ones the app uses.

    - An unknown path, partition or zone gets `404`, an invalid value in a PUT body
      `400`, both in the same style: small HTML body, no `Content-Type`.
      Unknown keys in a PUT body are silently ignored (`200`, nothing
      changes).

    - Background on zones, arming, alarms and resetting from the ABUS manuals
      is collected in docs/panel-behavior.md.

    - The Android app (2.6.6) defines exactly these calls in its API
      interface: GET /system/, /system/partitions/, /system/partitions-{n}/zones/,
      /alarms/, /faults/, /logs/, /outputs/, /cameras/ and /{imagePath};
      PUT /system/partitions-{n}/, /system/partitions-{n}/zones-{zone}/,
      /outputs-{id}/ and /register/. There is no separate call to
      acknowledge or reset an alarm; acknowledging is a partition state (see
      PartitionState). Findings from the app are marked with
      `x-sources: [android-app]`.

    - The panel's TLS handshake is very slow (several seconds); keep one
      connection alive and reuse TLS sessions. How the app uses the API is
      described in docs/app-behavior.md.

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: secvest.local
      port:
        default: "4433"

security:
  - basicAuth: []

x-open-questions:
  - What is the `device` header for? It has the size of an APNs token (64 hex
    characters) but stays all `f` even while the app sends the real token in
    PUT /register/, so it isn't the push token. The Android app's API code
    doesn't set it, so it is probably specific to the iOS app.
  - The firmware's name table contains "partsets" next to the known resources
    and field names. GET /system/partsets/ and GET /partsets/ both give 404,
    so it is probably a field name rather than a resource. Where is it used?
  - What does GET /register/ do? It answered 200 with an empty JSON body,
    unlike other unsupported methods (see below), so it probably exists and
    returns nothing without a matching device header or registration.

paths:
  /system/:
    get:
      summary: System name and partition ids
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
              examples:
                default:
                  externalValue: fixtures/GET_system.json
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/partitions/:
    get:
      summary: All partitions with state and zone ids
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partition"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /system/partitions-{partition}/:
    parameters:
      - $ref: "#/components/parameters/partition"
    get:
      summary: One partition
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partition"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions-1.json
                armedInternally:
                  externalValue: fixtures/GET_system_partitions-1.example2.json
                armed:
                  externalValue: fixtures/GET_system_partitions-1.example3.json
        "404":
          description: Unknown partition (seen for partitions-9)
          content:
            text/html:
              schema:
                type: string
              examples:
                unknownPartition:
                  externalValue: fixtures/GET_system_partitions-9.404.html
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
    put:
      summary: Arm, arm internally or disarm a partition
      description: >
        Returns the partition with its new state. The change took effect
        immediately (0.1–0.3 s through the proxy), and the next GET already
        showed the new state. Arming via the API (and the app) skips the exit
        time: on the test panel, configured for delayed arming with a 15 s exit
        time, both partset and set took effect at once. A pending battery fault (prevents-set false) did not block
        arming.


        Switching directly between partset and set is not possible: the panel
        answers `200` but ignores the request and returns the unchanged state
        (e.g. `set` for a request to `partset`). A client therefore has to
        compare the returned state with the requested one, and disarm first to
        switch between the two armed states. The same applies to an unknown key
        (200, nothing changes); an invalid state value gives 400.


        If arming is blocked, e.g. by an open omittable zone, the panel
        answers `409 Conflict` with the list of blocking faults (only those
        with `prevents-set`, other faults such as a weak battery are left
        out), for set and partset alike. After omitting the zone the same
        request succeeds. The list is evaluated for the requested state, so
        it can contain faults that GET /faults/ doesn't show.


        Open entry/exit door (zone type "Ein/Ausgang"): `set` answers 200 but
        silently does nothing — the partition stays unset, no tone, no log
        entry, no fault (tested repeatedly, still unset 30 s later). `partset`
        answers 409 with the door as a blocking zone-open fault, although
        GET /faults/ doesn't list it. Presumably, since arming via the API (and
        internal arming configured as "immediate") has no exit time, an open
        entry/exit door can't be left through and so blocks arming — reported
        as 409 for partset, but silently for set. A client has to check the
        returned state and look at the zones itself to tell the user which
        door is open. The app doesn't even try — it
        shows "Abfrage des Zustandes des Teilbereichs nicht erlaubt." without
        sending a request.
      x-evidence: verified
      x-sources: [node-red-contrib-secvest, homebridge-secvest]
      x-open-questions:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  $ref: "#/components/schemas/PartitionState"
            examples:
              armInternally:
                externalValue: fixtures/PUT_system_partitions-1.request.json
              disarm:
                externalValue: fixtures/PUT_system_partitions-1.example2.request.json
              arm:
                externalValue: fixtures/PUT_system_partitions-1.example3.request.json
              acknowledgeAlarm:
                summary: Acknowledge an alarm (from the Android app, not tried)
                value: { state: acknowledged }
              armInternallyWhileArmed:
                externalValue: fixtures/PUT_system_partitions-1.example4.request.json
              armWhileArmedInternally:
                externalValue: fixtures/PUT_system_partitions-1.example5.request.json
              unknownKey:
                summary: Ignored, see the 200 example unknownKeyIgnored
                externalValue: fixtures/PUT_system_partitions-1.example6.request.json
              invalidValue:
                summary: Gives 400
                externalValue: fixtures/PUT_system_partitions-1.400.request.json
              blockedSet:
                summary: set while zone 209 is open — gives 409
                externalValue: fixtures/PUT_system_partitions-1.409.request.json
              blockedPartset:
                summary: partset while zone 209 is open — gives 409
                externalValue: fixtures/PUT_system_partitions-1.409.example2.request.json
              setAfterOmitting:
                summary: set after omitting the open zone 209 — succeeds
                externalValue: fixtures/PUT_system_partitions-1.example7.request.json
              setWithEntryDoorOpen:
                summary: set while the entry/exit door 219 is open — ignored (200, unset)
                externalValue: fixtures/PUT_system_partitions-1.example8.request.json
              partsetWithEntryDoorOpen:
                summary: partset while the entry/exit door 219 is open — gives 409
                externalValue: fixtures/PUT_system_partitions-1.409.example3.request.json
      responses:
        "200":
          description: The partition with its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partition"
              examples:
                armedInternally:
                  externalValue: fixtures/PUT_system_partitions-1.json
                disarmed:
                  externalValue: fixtures/PUT_system_partitions-1.example2.json
                armed:
                  externalValue: fixtures/PUT_system_partitions-1.example3.json
                ignoredSetToPartset:
                  summary: partset requested while set — ignored, still set
                  externalValue: fixtures/PUT_system_partitions-1.example4.json
                ignoredPartsetToSet:
                  summary: set requested while partset — ignored, still partset
                  externalValue: fixtures/PUT_system_partitions-1.example5.json
                unknownKeyIgnored:
                  summary: '{"statesss":"set"} — ignored, still unset'
                  externalValue: fixtures/PUT_system_partitions-1.example6.json
                armedWithOmittedZone:
                  summary: set after omitting the open zone 209
                  externalValue: fixtures/PUT_system_partitions-1.example7.json
                ignoredEntryDoorOpen:
                  summary: set while the entry/exit door 219 is open — ignored, still unset
                  externalValue: fixtures/PUT_system_partitions-1.example8.json
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >
            Arming blocked. The body lists the blocking faults (the ones with
            prevents-set); seen for an open omittable zone, for set and
            partset.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fault"
              examples:
                openZoneSet:
                  summary: set requested while zone 209 was open
                  externalValue: fixtures/PUT_system_partitions-1.409.json
                openZonePartset:
                  summary: partset requested while zone 209 was open
                  externalValue: fixtures/PUT_system_partitions-1.409.example2.json
                entryDoorOpenPartset:
                  summary: >
                    partset requested while the entry/exit door 219 was open
                    (not listed in GET /faults/ at the same time)
                  externalValue: fixtures/PUT_system_partitions-1.409.example3.json
        "401":
          $ref: "#/components/responses/Unauthorized"

  /system/partitions-{partition}/zones/:
    parameters:
      - $ref: "#/components/parameters/partition"
    get:
      summary: Zones (detectors) of a partition
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions-1_zones.json
                otherStates:
                  summary: Same zones a few minutes later
                  externalValue: fixtures/GET_system_partitions-1_zones.example2.json
                doorAndWindowOpen:
                  summary: Zone 209 (omittable) and zone 219 (not omittable) open
                  externalValue: fixtures/GET_system_partitions-1_zones.example3.json
                emptyPartition:
                  summary: Partition without zones (partition 2)
                  externalValue: fixtures/GET_system_partitions-2_zones.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /system/partitions-{partition}/zones-{zone}/:
    parameters:
      - $ref: "#/components/parameters/partition"
      - $ref: "#/components/parameters/zone"
    get:
      summary: One zone
      description: Returns the same object as one element of the zone list.
      x-evidence: verified
      responses:
        "200":
          description: The zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
              examples:
                default:
                  externalValue: fixtures/GET_system_partitions-1_zones-209.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"
        "404":
          description: Unknown zone (seen for zone 220)
          content:
            text/html:
              schema:
                type: string
              examples:
                unknownZone:
                  externalValue: fixtures/GET_system_partitions-1_zones-220.404.html
    put:
      summary: Omit (bypass) a zone or include it again
      description: >
        Used by the app's "Zone ausblenden" dialog for an open zone. Omitting
        an open zone removes its zone-open fault (prevents-set), so the
        partition can be armed. Closed zones can be omitted and included as
        well. The omission lasts one arming cycle: after arming (set or
        partset) and disarming again, the zone reports `omitted: false`
        (tested, matches the user manual). Note that `omitted` is sent as a string.


        Error behaviour: an unknown key is ignored (200 with the unchanged
        zone), an invalid value gives 400, a zone with `omittable: false`
        gives 403 with an empty body, an unknown zone gives 404. Because an
        ignored request still answers 200, compare the returned `omitted`
        with the requested value.
      x-evidence: verified
      x-open-questions:
        - (answered) The omission itself is not logged when it is set. The log
          shows "Ben<user> Zone<id> ausgeblendet" when the partition is armed
          with the zone omitted, and "Ben053 Zone<id> ausgeblendet ok" when it
          is included again at disarm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [omitted]
              properties:
                omitted:
                  type: string
                  enum: ["true", "false"]
            examples:
              omit:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.request.json
              include:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.example2.request.json
              omitClosedZone:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.example3.request.json
              includeClosedZone:
                externalValue: fixtures/PUT_system_partitions-1_zones-209.example4.request.json
              unknownKey:
                summary: Ignored, see the 200 example unknownKeyIgnored
                externalValue: fixtures/PUT_system_partitions-1_zones-209.example5.request.json
              invalidValue:
                summary: Gives 400
                externalValue: fixtures/PUT_system_partitions-1_zones-209.400.request.json
              notOmittable:
                summary: Zone 219 (omittable false), gives 403
                externalValue: fixtures/PUT_system_partitions-1_zones-219.403.request.json
              unknownZone:
                summary: Zone 220, gives 404
                externalValue: fixtures/PUT_system_partitions-1_zones-220.404.request.json
      responses:
        "200":
          description: The zone after the change (or unchanged, if the key was unknown)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
              examples:
                omitted:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.json
                included:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.example2.json
                closedZoneOmitted:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.example3.json
                closedZoneIncluded:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.example4.json
                unknownKeyIgnored:
                  externalValue: fixtures/PUT_system_partitions-1_zones-209.example5.json
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Either the zone is not omittable (Content-Type application/json,
            empty body) or the installer is logged in at the panel
            (`{"state":"installer"}`, see InstallerLoggedIn). Tell them apart
            by the body.
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    maxLength: 0
                  - type: object
                    properties:
                      state:
                        type: string
                        const: installer
        "404":
          description: Unknown zone (seen for zone 220)
          content:
            text/html:
              schema:
                type: string
              examples:
                unknownZone:
                  externalValue: fixtures/PUT_system_partitions-1_zones-220.404.html

  /register/:
    put:
      summary: Register the app for push notifications
      description: >
        Sent by the app when the panel's connection settings are saved in the
        app (the screen with the address, confirmed with the check mark), e.g.
        when adding the panel; twice in the capture, 11 s apart. Each call creates a new entry in the panel's push device list
        (web interface, Configuration -> Push Mitteilungen), even with the same
        token, listed with the device name and the user derived from
        `username`. A new entry has "Zugriff" (access) unchecked; according to
        the app guide an administrator has to enable the device there before it
        receives push notifications. Nothing is sent at a normal app start.
      x-evidence: verified
      x-open-questions:
        - Response status and body — in both captured calls the connection was
          closed after 1-2 s without a response, yet the device was
          registered. The Android app reads the raw response and knows the
          outcomes OK, NOT_FOUND and Unauthorized (presumably from the HTTP
          status).
        - How is a registration removed or updated from the app side, if at
          all?
        - Values of `platform` besides `ios` (presumably `android`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, language, device-name, token, platform]
              properties:
                username:
                  type: string
                  description: The user code the app authenticates with.
                language:
                  type: string
                  description: Presumably the language of the push texts.
                  examples: [de]
                device-name:
                  type: string
                  description: Shown as the device name in the push device list.
                token:
                  type: string
                  description: APNs device token, 64 hex characters.
                  pattern: "^[0-9a-f]{64}$"
                platform:
                  type: string
                  examples: [ios]
            examples:
              ios:
                externalValue: fixtures/PUT_register.request.json
      responses:
        default:
          description: Not captured yet (see x-open-questions).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /alarms/:
    get:
      summary: Active alarms
      x-evidence: verified
      x-open-questions:
        - The entry format comes from the Android app (see Alarm); an actual
          response during an alarm hasn't been seen yet.
        - Does an entry stay until the alarm is acknowledged or reset? The app
          acknowledges via PUT /system/partitions-{n}/ with state
          acknowledged; it has no call for the reset ("rücksetzen") the
          manual describes — that may happen implicitly or only at the keypad.
        - Not part of the API, but useful for event-driven clients — the panel
          can send an e-mail with the alarm text (e.g. "Einbruch Z01 Alarm")
          when an alarm occurs (user manual, alarm transmission via e-mail).
      description: >
        Stays empty during an entry time (checked), i.e. an entry delay is not
        an alarm yet. The partition keeps reporting set/partset meanwhile; only
        the log shows that an entry time is running.
      responses:
        "200":
          description: Empty array when no alarm is active
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alarm"
              examples:
                idle:
                  externalValue: fixtures/GET_alarms.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /faults/:
    get:
      summary: Current faults (troubles)
      description: >
        An open zone only shows up here if it blocks arming. On the test panel
        the entry doors are of zone type "Ein/Ausgang" (entry/exit), which may
        be open when arming because the user leaves through them, so they
        produce no fault. They also happen to be non-omittable; that is a
        separate installer setting. Whether a door is open therefore has to be
        read from the zones.


        This list reflects the current state only. Whether a particular arming
        request will be blocked can't be fully predicted from it: an open
        entry/exit door blocks partset (409) and makes set a silent no-op,
        without ever appearing here (see PUT /system/partitions-{n}/).
      x-evidence: verified
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fault"
              examples:
                zoneOpenAndBattery:
                  externalValue: fixtures/GET_faults.json
                batteryOnly:
                  externalValue: fixtures/GET_faults.example2.json
                otherZoneOpen:
                  externalValue: fixtures/GET_faults.example3.json
                nonOmittableZoneOpen:
                  summary: >
                    Zones 209 (omittable) and 219 (not omittable) open at the
                    same time — only 209 is a fault, compare the zones example
                    doorAndWindowOpen
                  externalValue: fixtures/GET_faults.example4.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /logs/:
    get:
      summary: Event log
      description: >
        Without a filter the panel returned 600 entries, not strictly sorted;
        600 is the documented log capacity. Entries are overwritten in the
        order they were written, not by their timestamp: a later log had
        dropped 100 entries from all over the timestamp range, including
        recent ones. Entries dated 2019-01-01 are probably written after a
        restart before the clock was set (assumption).


        What gets logged for arming (seen): "Ben<user> TB <n> aktiv" /
        "intern aktiv" / "deaktiv" for arming via keypad, app and API alike;
        "Ben<user>TB <n> Übergehen" with every arming, presumably for
        overriding permitted faults; "Ben<user> TB <n> Ausgang" when an exit
        time starts at the keypad; "Eing gest. Z<zone>" when an entry time
        starts (the zone is only in the text, the event has no zone or user
        field). Arming attempts rejected with 409 or silently ignored are not
        logged.


        Log requests are slow: 6 s for a filtered request returning 22
        entries, while the other endpoints answer in about 0.1 s.
        The fixture is a subset with one entry per message pattern. The app
        only ever asks for entries newer than the newest one it already has,
        using an OData-style `$filter`, and keeps older entries in a local
        cache — so it can show entries the panel has long overwritten. After
        clearing the app's cache it shows exactly the unfiltered response
        (checked for all alarm and trouble entries). The app's log filters
        "Alarme" and "Störungen" correspond to `type` alarm and trouble.
      x-evidence: verified
      x-open-questions:
      parameters:
        - name: $filter
          in: query
          required: false
          description: >
            OData-style filter. Seen: `timestamp ge <unix seconds>` (the app
            uses the newest known timestamp + 1). Returns `[]` when nothing
            matches. The firmware contains only this one filter pattern, so
            other operators or fields are most likely not supported.
          schema:
            type: string
          examples:
            newerThan:
              value: timestamp ge 1789473729
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
              examples:
                subset:
                  externalValue: fixtures/GET_logs.json
                armingCycles:
                  summary: >
                    Arming cycles from a later log — keypad arming with exit
                    time, and arming with an omitted zone
                  externalValue: fixtures/GET_logs.example2.json
                filteredNothingNew:
                  summary: $filter=timestamp ge <newest known + 1>
                  externalValue: fixtures/GET_logs_filter-timestamp-ge.json
                filteredEntryTime:
                  summary: >
                    $filter=timestamp ge <start of day>, excerpt — arming,
                    entry time started by entry/exit door 219, disarming (set
                    twice, then partset)
                  externalValue: fixtures/GET_logs_filter-timestamp-ge.example2.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /outputs/:
    get:
      summary: Outputs
      description: >
        node-red-contrib-secvest requests `/output/` (singular); the app uses
        `/outputs/`. `/output/` is untested.
      x-evidence: verified
      x-open-questions:
        - No outputs are configured on the test panel; the entry format is
          taken from the Android app (see Output).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Output"
              examples:
                none:
                  externalValue: fixtures/GET_outputs.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /outputs-{output}/:
    parameters:
      - name: output
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Switch an output on or off
      description: >
        Taken from the Android app; not tried (the test panel has no
        user-switchable outputs). Returns the output after the change.
      x-evidence: source
      x-sources: [android-app]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: ["on", "off"]
      responses:
        "200":
          description: The output after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Output"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

  /cameras/:
    get:
      summary: Cameras
      x-evidence: verified
      x-open-questions:
        - No cameras are configured on the test panel; the entry format is
          taken from the Android app (see Camera).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
              examples:
                none:
                  externalValue: fixtures/GET_cameras.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InstallerLoggedIn"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Secvest user code as username.

  responses:
    Unauthorized:
      description: >
        Wrong credentials. Plain HTML body without a Content-Type header and
        without a WWW-Authenticate challenge. Seen on GET /system/; assumed
        for the other endpoints.
      content:
        text/html:
          schema:
            type: string
          examples:
            unauthorized:
              externalValue: fixtures/GET_system.401.html

    BadRequest:
      description: >
        Invalid value in a PUT body (e.g. {"state":"setsss"} or
        {"omitted":"trueest"}). Plain HTML body without a Content-Type
        header, like the 401 and 404. Unknown keys don't cause it — they are
        ignored with 200.
      content:
        text/html:
          schema:
            type: string
          examples:
            invalidState:
              externalValue: fixtures/PUT_system_partitions-1.400.html
            invalidOmitted:
              externalValue: fixtures/PUT_system_partitions-1_zones-209.400.html

    NotFound:
      description: >
        Unknown path (seen for GET /system404/). Plain HTML body without a
        Content-Type header, like the 401. Whether unknown ids on known
        resources answer the same way is still open.
      content:
        text/html:
          schema:
            type: string
          examples:
            notFound:
              externalValue: fixtures/GET_unknown-path.404.html

    InstallerLoggedIn:
      description: >
        The installer is logged in at the panel; the API is locked until they
        log out. Seen on every GET and on all three partition PUTs; not tested
        for the single zone (GET/PUT) and the zones of partitions 2-4. Unlike a 200, the
        response has no Cache-Control header.
      content:
        application/json:
          schema:
            type: object
            properties:
              state:
                type: string
                const: installer
          examples:
            installer:
              externalValue: fixtures/GET_system.403.json

  parameters:
    partition:
      name: partition
      in: path
      required: true
      description: >
        Partition id, without leading zeros (`partitions-1`). The panel
        reports partitions 1-4.
      schema:
        type: integer
        minimum: 1
        maximum: 4
      example: 1

    zone:
      name: zone
      in: path
      required: true
      description: >
        Zone id as listed in the partition's `zones` (`zones-209`). All ids
        seen so far have three digits. According to the user manual, the 48
        wireless zones are Z201 onwards and the wired zones Z301-Z304; with
        4-wire wiring the manual labels them Z301A/Z301T and Z302A/Z302T
        (alarm/tamper), and it is unknown how the API represents those. The
        numbering of the IP (camera) zones isn't documented. The test panel
        only has wireless zones.
      schema:
        type: string
        pattern: "^[0-9]{3}$"
      example: "209"

  schemas:
    PartitionState:
      type: string
      enum: [unset, partset, set]
      x-enum-not-observed: [unset-alarm, set-alarm, partset-alarm, alarm, acknowledged]
      x-sources: [firmware, android-app]
      description: >
        unset = disarmed, partset = armed internally (home), set = armed —
        the only values observed so far.


        Alarm states (not observed yet): the Android app knows set_alarm,
        unset_alarm, partset_alarm, alarm and acknowledged, and treats the
        four alarm values as "in alarm". The firmware contains the same
        values spelled with a hyphen (set-alarm, …), so the exact spelling on
        the wire is still open.


        State rules the app applies before sending a PUT: set/partset only
        from unset and not in alarm; unset only from set/partset or from
        acknowledged; acknowledged only while in alarm. So an alarm is
        acknowledged with PUT {"state":"acknowledged"}, after which the
        partition can be disarmed. There is no "arming"
        state either: while the exit time runs after arming at the keypad, the
        partition still reports unset and only switches to set when the exit
        time is over (tested with a 15 s exit time).

    Alarm:
      type: object
      x-evidence: source
      x-sources: [android-app]
      description: >
        One active alarm, as the Android app parses it. Not observed yet.
      properties:
        id:
          type: integer
        type:
          type: string
          description: >
            Alarm class as a numeric string: "0" undefined, "1" faults,
            "2" technical, "3" fire, "4" burglary, "6" medical, "7" panic,
            "8" social, "9" inactivity ("5" is not defined in the app).
        affects-partition:
          type: integer
          description: A single partition id here, unlike the list in Fault.

    Output:
      type: object
      x-evidence: source
      x-sources: [android-app]
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
          enum: ["on", "off"]
        manual:
          type: boolean
          description: Presumably whether the user may switch it.
        interval:
          type: integer
        timed:
          description: Type unknown.

    Camera:
      type: object
      x-evidence: source
      x-sources: [android-app]
      description: >
        IP camera connected to the panel. Note that the app model contains
        the camera's password, i.e. the panel hands it out to the app.
      properties:
        id:
          type: integer
        name:
          type: string
        partitions:
          type: array
          items:
            type: integer
        intern-ip:
          type: string
        http-port:
          type: integer
        https-port:
          type: integer
        https-enabled:
          type: boolean
        rtsp-port:
          type: integer
        extern-http-port:
          type: integer
        extern-https-port:
          type: integer
        extern-rtsp-port:
          type: integer
        password:
          type: string

    System:
      type: object
      required: [name, partitions]
      properties:
        name:
          type: string
        partitions:
          type: array
          items:
            type: string

    Partition:
      type: object
      required: [id, name, state, zones]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unused partitions are named "Teilber. <n>" by default.
        state:
          $ref: "#/components/schemas/PartitionState"
        zones:
          type: array
          description: Ids of the zones assigned to the partition.
          items:
            type: string

    Zone:
      type: object
      required: [id, name, state, inner, omittable, omitted]
      properties:
        id:
          type: string
          description: Wireless zones are numbered from 201, wired zones from 301
            (user manual).
        name:
          type: string
        state:
          type: string
          description: Only open and closed seen so far. The firmware lists
            tamper, fault and zoneFault next to them (not observed). The installer web interface additionally shows battery
            low, supervision fault, tamper and signal strength (RSSI) per zone,
            none of which is part of this object — battery and tamper show up
            in /faults/ and the log instead.
          examples: [closed, open]
        inner:
          type: boolean
          description: Most likely the zone property "Intern überwacht" —
            the zone is monitored when armed internally (partset). Every zone
            on the test panel has that property and reports true, so a zone
            without it is still needed to confirm. See docs/panel-behavior.md.
        omittable:
          type: boolean
          description: Whether the zone may be omitted (bypassed) for arming.
            Mirrors the zone property "Ausblendbar" set by the installer
            (checked against the installer web interface). False for the
            entry doors on the test panel.
        omitted:
          type: boolean
          description: Whether the zone is currently omitted.

    Fault:
      type: object
      required: [type, id, ui-string, affects-partition, prevents-set, prevents-reset, is-rf-warning]
      properties:
        type:
          type: string
          description: >
            Fault class. Seen: 1170 = repeater battery low, 5000 = zone open.
        id:
          type: string
          description: >
            For zone-open faults it has always been 1305 + zone id so far
            (1514 for zone 209, 1517 for zone 212, 1524 for zone 219) — an
            observation, not documented.
        ui-string:
          type: string
          description: Text as shown on the panel, e.g. "REP01 Batt schwach".
            Not stable — the same fault (same type and id) was once reported
            as "RF Repeater" in between, so don't use it as a key.
        affects-partition:
          type: array
          items:
            type: string
        affects-zone:
          type: string
          description: Only present for zone-related faults.
        prevents-set:
          type: boolean
          description: Arming is blocked while this fault is present. Omitting
            the zone removes a zone-open fault.
        prevents-reset:
          type: boolean
          description: Presumably blocks resetting the panel after an alarm
            (see /alarms/); never true so far. Which alarms the user may reset
            is an installer setting.
        is-rf-warning:
          type: boolean

    LogEntry:
      type: object
      required: [id, type, desc, events]
      properties:
        id:
          type: string
          description: >
            Appears to be (unix timestamp << 8) | sequence number within that
            second.
        type:
          type: string
          enum: [normal, alarm, trouble]
        desc:
          type: string
          description: >
            Text as shown on the panel, e.g. "Ben 001 TB 1 aktiv" (user 1 armed
            partition 1), "Einbruch Z202 Alarm", "REP01 Batt schwach".
        events:
          type: array
          description: Exactly one element in every entry seen so far.
          items:
            $ref: "#/components/schemas/LogEvent"

    LogEvent:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: string
          description: >
            The panel's local wall-clock time, encoded as Unix seconds — read
            it as UTC to get the local time. With the panel in CEST, entries
            are 2 h ahead of the real Unix time (checked against the HTTP Date
            header), and the app shows them the same way.
        partition:
          type: string
          description: '"0" in every entry seen so far.'
        user:
          type: string
          description: User slot ("0" = installer). Entries by "Ben053" carry no
            user; 53 seems to be the panel itself (time set, zone re-included).
        username:
          type: string
        zone:
          type: string
        images:
          type: array
          x-sources: [android-app]
          description: >
            Paths of camera images belonging to the event (from the Android
            app, not observed); the app loads them with GET /{imagePath}.
          items:
            type: string
